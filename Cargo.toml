[workspace]
members = [
    "crates/pasteport-core",
    "crates/pasteport-clipboard",
    "crates/pasteport-daemon",
    "crates/pasteport-cli",
    "crates/pasteport-ffi",
]
# pasteport-gtk needs system GTK4 development headers, so it is not built by
# default. Build it explicitly on Linux: cargo build -p pasteport-gtk
exclude = ["crates/pasteport-gtk"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
license = "AGPL-3.0-or-later"
repository = "https://github.com/ChrisJohnson89/pasteport"
homepage = "https://github.com/ChrisJohnson89/pasteport"
authors = ["Christopher Johnson"]

[workspace.dependencies]
pasteport-core = { path = "crates/pasteport-core", version = "0.1.0" }
pasteport-clipboard = { path = "crates/pasteport-clipboard", version = "0.1.0" }
pasteport-daemon = { path = "crates/pasteport-daemon", version = "0.1.0" }

anyhow = "1.0"
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rusqlite = { version = "0.32", features = ["bundled", "blob"] }
blake3 = "1.5"
time = { version = "0.3", features = ["formatting", "parsing", "macros"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
directories = "5.0"
base64 = "0.22"
clap = { version = "4.5", features = ["derive"] }
toml = "0.8"
tempfile = "3.13"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
