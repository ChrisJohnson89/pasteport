[package]
name = "pasteport-license"
description = "Offline license verification for Pasteport"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[features]
default = []
# Key generation and license signing. Deliberately off by default so shipped
# binaries contain no signing code at all.
mint = []

[[bin]]
name = "pasteport-mint"
path = "src/bin/pasteport-mint.rs"
required-features = ["mint"]

[dependencies]
base64.workspace = true
ed25519-dalek.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
time.workspace = true
tracing.workspace = true

[dev-dependencies]
pasteport-license = { path = ".", features = ["mint"] }
tempfile.workspace = true
